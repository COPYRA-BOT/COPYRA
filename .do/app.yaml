# DigitalOcean App Platform — COPYRA
#
# Source Directory MUST be blank / repository root.
# Dockerfile path: Dockerfile
# Branch: dev
#
# Do not put secrets in this file. Set them in the App Platform
# "App-Level Environment Variables" / encrypted vars UI.

name: copyra
region: nyc
features:
  - buildpack-stack=ubuntu-22
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: COPYRA-BOT/COPYRA
      branch: main
      deploy_on_push: true
    # Must match process listen port (PORT / API_PORT). App Platform sets PORT
    # from this value and probes http_path until it returns 200.
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 6
    run_command: npm run start -w @copyra/api
    envs:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8080"
      - key: API_PORT
        value: "8080"
      # Set the rest as encrypted App-Level secrets in the DO UI — never commit:
      # DATABASE_URL (public Postgres), REDIS_URL (public rediss://, not private-),
      # SESSION_SECRET (>=32 chars), SOLANA_RPC_URL, SOLANA_WS_URL,
      # SOLANA_RPC_FALLBACK_URLS, JUPITER_API_KEY, EVM_*_RPC_URL, EVM_*_WS_URL,
      # TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, SENTRY_DSN, PUBLIC_API_URL,
      # PUBLIC_WEB_URL, CORS_ORIGINS, TRADING_ENABLED=false,
      # SOL_TRADING_ENABLED=false, EVM_TRADING_ENABLED=false,
      # VITE_REOWN_PROJECT_ID, NEXT_PUBLIC_REOWN_PROJECT_ID
      # Bot keys only if you intend to trade:
      # SOLANA_BOT_PRIVATE_KEY, EVM_BOT_PRIVATE_KEY
      - key: TRADING_ENABLED
        value: "false"
      - key: SOL_TRADING_ENABLED
        value: "false"
      - key: EVM_TRADING_ENABLED
        value: "false"

  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: COPYRA-BOT/COPYRA
      branch: main
      deploy_on_push: true
    http_port: 43127
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: npm run preview -w @copyra/web -- --host 0.0.0.0 --port 43127
    envs:
      - key: NODE_ENV
        value: production

workers:
  - name: worker
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: COPYRA-BOT/COPYRA
      branch: main
      deploy_on_push: true
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: npm run start -w @copyra/worker
    envs:
      - key: NODE_ENV
        value: production
