# DigitalOcean App Platform — COPYRA
# Push to GitHub main → autodeploy. See docs/DEPLOY.md.
#
# Architecture (phase-4 ready):
#  * api     — HTTP + dashboard only (health checks stay green)
#  * worker  — dedicated 24/7 copy-trade process (SOL + EVM + exits)
# Keeping them on separate containers is what stops Degraded/503 when the
# trading engine is busy.
#
# Domain: Cloudflare DNS must be DNS-only (grey cloud). Custom domain must
# show Active (not Configuring) in DO → Networking → Domains.

name: copyra
region: nyc
features:
  - buildpack-stack=ubuntu-22
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# App-level flags — apply to api + worker (override any stale component false).
envs:
  - key: TRADING_ENABLED
    value: "true"
    scope: RUN_TIME
  - key: SOL_TRADING_ENABLED
    value: "true"
    scope: RUN_TIME
  - key: EVM_TRADING_ENABLED
    value: "true"
    scope: RUN_TIME
  - key: MULTI_USER_CUSTODY
    value: "true"
    scope: RUN_TIME
  # Must be App-Level so worker Telegram alerts never footer localhost defaults.
  - key: PUBLIC_WEB_URL
    value: "https://copyra.fun"
    scope: RUN_TIME
  - key: PUBLIC_API_URL
    value: "https://copyra.fun"
    scope: RUN_TIME
  # Admin ops chat — receives ALL worker notifications (skip/detect/buy/sell/errors).
  # TELEGRAM_BOT_TOKEN stays an encrypted App-Level secret.
  - key: TELEGRAM_CHAT_ID
    value: "-5389164510"
    scope: RUN_TIME
  # Public OAuth client id (safe in frontend). Secret stays encrypted App-Level only.
  - key: GOOGLE_CLIENT_ID
    value: "262135154840-d5tr76fnjatnkg7qdjmptmj7jcbcjpbv.apps.googleusercontent.com"
    scope: RUN_TIME
  - key: WEBAUTHN_RP_ID
    value: "copyra.fun"
    scope: RUN_TIME
  - key: WEBAUTHN_RP_NAME
    value: "COPYRA"
    scope: RUN_TIME

domains:
  - domain: copyra.fun
    type: PRIMARY
  - domain: www.copyra.fun
    type: ALIAS

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
    - match:
        path:
          prefix: /health
      component:
        name: api
    - match:
        path:
          prefix: /
      component:
        name: api

# ---------------------------------------------------------------------------
# API + dashboard (no in-process worker)
# ---------------------------------------------------------------------------
services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: COPYRA-BOT/COPYRA
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /health
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 15
      success_threshold: 1
      # Prefer staying Healthy through brief CPU blips; worker is a separate component.
      failure_threshold: 36
    run_command: /app/scripts/start-production.sh
    envs:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=512"
      - key: API_HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8080"
      - key: API_PORT
        value: "8080"
      # Worker runs as its own component — never start it inside the API box.
      - key: RUN_WORKER
        value: "false"
      - key: PUBLIC_WEB_URL
        value: "https://copyra.fun"
      - key: PUBLIC_API_URL
        value: "https://copyra.fun"
      - key: PUBLIC_PLATFORM_URL
        value: "https://copyra-nl7kz.ondigitalocean.app"
      - key: CORS_ORIGINS
        value: "https://copyra.fun,https://www.copyra.fun,https://copyra-nl7kz.ondigitalocean.app"
      - key: TRADING_ENABLED
        value: "true"
      - key: SOL_TRADING_ENABLED
        value: "true"
      - key: EVM_TRADING_ENABLED
        value: "true"
      - key: MULTI_USER_CUSTODY
        value: "true"
      - key: GOOGLE_CLIENT_ID
        value: "262135154840-d5tr76fnjatnkg7qdjmptmj7jcbcjpbv.apps.googleusercontent.com"
      - key: WEBAUTHN_RP_ID
        value: "copyra.fun"
      - key: WEBAUTHN_RP_NAME
        value: "COPYRA"
      # App-Level encrypted secrets (scope ALL components / RUN_AND_BUILD_TIME):
      # DATABASE_URL, DIRECT_URL, PGBOUNCER, REDIS_URL, SESSION_SECRET,
      # SOLANA_BOT_PRIVATE_KEY, EVM_BOT_PRIVATE_KEY,
      # SOLANA_RPC_URL, SOLANA_WS_URL, SOLANA_BACKUP_RPC_URL, SOLANA_BACKUP_WS_URL,
      # SOLANA_RPC_FALLBACK_URLS, JUPITER_API_KEY,
      # EVM_*_RPC_URL, EVM_*_WS_URL, EVM_BSC_BACKUP_RPC_URL, EVM_BSC_BACKUP_WS_URL,
      # ZERO_EX_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
      # VITE_REOWN_PROJECT_ID / REOWN_PROJECT_ID,
      # GOOGLE_CLIENT_SECRET, RESEND_API_KEY, ACCOUNT_EMAIL_FROM

# ---------------------------------------------------------------------------
# Dedicated 24/7 copy-trade worker (not HTTP-routable)
# ---------------------------------------------------------------------------
workers:
  - name: worker
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: COPYRA-BOT/COPYRA
      branch: main
      deploy_on_push: true
    instance_count: 1
    # Own vCPU/RAM — catch-up and exits cannot starve API /health.
    instance_size_slug: basic-xs
    # Health server inside start-worker.sh answers /health if DO probes the port.
    run_command: /app/scripts/start-worker.sh
    envs:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=768"
      - key: PORT
        value: "8080"
      - key: HEALTH_PORT
        value: "8080"
      - key: TRADING_ENABLED
        value: "true"
      - key: SOL_TRADING_ENABLED
        value: "true"
      - key: EVM_TRADING_ENABLED
        value: "true"
      - key: MULTI_USER_CUSTODY
        value: "true"
      - key: PUBLIC_WEB_URL
        value: "https://copyra.fun"
      - key: PUBLIC_API_URL
        value: "https://copyra.fun"
