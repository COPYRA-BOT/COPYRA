# DigitalOcean App Platform — COPYRA
# Push to GitHub main → autodeploy. See docs/DEPLOY.md.
#
# Architecture (phase-4 ready):
#  * api     — HTTP + dashboard only (health checks stay green)
#  * worker  — dedicated 24/7 copy-trade process (SOL + EVM + exits)
# Keeping them on separate containers is what stops Degraded/503 when the
# trading engine is busy.
#
# Domain: Cloudflare DNS must be DNS-only (grey cloud). Custom domain must
# show Active (not Configuring) in DO → Networking → Domains.

name: copyra
region: nyc
features:
  - buildpack-stack=ubuntu-22
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

domains:
  - domain: copyra.fun
    type: PRIMARY
  - domain: www.copyra.fun
    type: ALIAS

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
    - match:
        path:
          prefix: /health
      component:
        name: api
    - match:
        path:
          prefix: /
      component:
        name: api

# ---------------------------------------------------------------------------
# API + dashboard (no in-process worker)
# ---------------------------------------------------------------------------
services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: COPYRA-BOT/COPYRA
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /health
      initial_delay_seconds: 45
      period_seconds: 10
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 18
    run_command: /app/scripts/start-production.sh
    envs:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=512"
      - key: API_HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8080"
      - key: API_PORT
        value: "8080"
      # Worker runs as its own component — never start it inside the API box.
      - key: RUN_WORKER
        value: "false"
      - key: PUBLIC_WEB_URL
        value: "https://copyra.fun"
      - key: PUBLIC_API_URL
        value: "https://copyra.fun"
      - key: PUBLIC_PLATFORM_URL
        value: "https://copyra-nl7kz.ondigitalocean.app"
      - key: CORS_ORIGINS
        value: "https://copyra.fun,https://www.copyra.fun,https://copyra-nl7kz.ondigitalocean.app"
      - key: TRADING_ENABLED
        value: "true"
      - key: SOL_TRADING_ENABLED
        value: "true"
      - key: EVM_TRADING_ENABLED
        value: "true"
      - key: MULTI_USER_CUSTODY
        value: "true"
      # App-Level encrypted secrets (scope ALL components / RUN_AND_BUILD_TIME):
      # DATABASE_URL, DIRECT_URL, PGBOUNCER, REDIS_URL, SESSION_SECRET,
      # SOLANA_BOT_PRIVATE_KEY, EVM_BOT_PRIVATE_KEY,
      # SOLANA_RPC_URL, SOLANA_WS_URL, SOLANA_RPC_FALLBACK_URLS, JUPITER_API_KEY,
      # EVM_*_RPC_URL, EVM_*_WS_URL, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
      # VITE_REOWN_PROJECT_ID / REOWN_PROJECT_ID,
      # GOOGLE_CLIENT_ID, RESEND_API_KEY, ACCOUNT_EMAIL_FROM,
      # WEBAUTHN_RP_ID, WEBAUTHN_RP_NAME

# ---------------------------------------------------------------------------
# Dedicated 24/7 copy-trade worker (not HTTP-routable)
# ---------------------------------------------------------------------------
workers:
  - name: worker
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: COPYRA-BOT/COPYRA
      branch: main
      deploy_on_push: true
    instance_count: 1
    # Own vCPU/RAM — catch-up and exits cannot starve API /health.
    instance_size_slug: basic-xs
    run_command: /app/scripts/start-worker.sh
    envs:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=768"
      - key: TRADING_ENABLED
        value: "true"
      - key: SOL_TRADING_ENABLED
        value: "true"
      - key: EVM_TRADING_ENABLED
        value: "true"
      - key: MULTI_USER_CUSTODY
        value: "true"
      - key: PUBLIC_WEB_URL
        value: "https://copyra.fun"
      - key: PUBLIC_API_URL
        value: "https://copyra.fun"
