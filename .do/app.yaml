# DigitalOcean App Platform — COPYRA (single image: API + dashboard + worker)
# Push to GitHub main → autodeploy. See docs/DEPLOY.md and docs/live-urls.json.

name: copyra
region: nyc
features:
  - buildpack-stack=ubuntu-22
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

domains:
  - domain: copyra.fun
    type: PRIMARY

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
    - match:
        path:
          prefix: /health
      component:
        name: api
    - match:
        path:
          prefix: /
      component:
        name: api

services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: COPYRA-BOT/COPYRA
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 35
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
    run_command: /app/scripts/start-production.sh
    envs:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8080"
      - key: API_PORT
        value: "8080"
      - key: RUN_WORKER
        value: "true"
      - key: PUBLIC_WEB_URL
        value: "https://copyra.fun"
      - key: PUBLIC_API_URL
        value: "https://copyra.fun"
      # Set PUBLIC_PLATFORM_URL to your DO starter URL (Overview → Live App
      # when using *.ondigitalocean.app). Add the same host to CORS_ORIGINS.
      - key: CORS_ORIGINS
        value: "https://copyra.fun"
      - key: TRADING_ENABLED
        value: "false"
      - key: SOL_TRADING_ENABLED
        value: "false"
      - key: EVM_TRADING_ENABLED
        value: "false"
      # Encrypted App-Level secrets in the DO UI — never commit:
      # DATABASE_URL, REDIS_URL, SESSION_SECRET, RPC/Telegram/Reown vars,
      # SOLANA_BOT_PRIVATE_KEY, EVM_BOT_PRIVATE_KEY (only if trading)
