# DigitalOcean App Platform — COPYRA (single image: API + dashboard + worker)
# Push to GitHub main → autodeploy. See docs/DEPLOY.md and docs/live-urls.json.

name: copyra
region: nyc
features:
  - buildpack-stack=ubuntu-22
alerts:
  - rule: DEPLOYMENT_FAILED

# IMPORTANT: do NOT register copyra.fun here while Cloudflare proxies the domain.
# App Platform already terminates TLS on *.ondigitalocean.app (built-in Cloudflare).
# Putting the custom domain on BOTH Cloudflare (nameservers) and App Platform
# breaks origin cert validation → HTTPS 526 and app status "Degraded".
# Keep copyra.fun only in Cloudflare; origin = this app’s *.ondigitalocean.app host
# with a Cloudflare Origin Rule that rewrites the Host header (see docs/DEPLOY.md).

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
    - match:
        path:
          prefix: /health
      component:
        name: api
    - match:
        path:
          prefix: /
      component:
        name: api

services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: COPYRA-BOT/COPYRA
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 12
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 6
    run_command: /app/scripts/start-production.sh
    envs:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8080"
      - key: API_PORT
        value: "8080"
      - key: RUN_WORKER
        value: "true"
      - key: PUBLIC_WEB_URL
        value: "https://copyra.fun"
      - key: PUBLIC_API_URL
        value: "https://copyra.fun"
      - key: PUBLIC_PLATFORM_URL
        value: "https://copyra-nl7kz.ondigitalocean.app"
      - key: CORS_ORIGINS
        value: "https://copyra.fun,https://www.copyra.fun,https://copyra-nl7kz.ondigitalocean.app"
      - key: TRADING_ENABLED
        value: "true"
      - key: SOL_TRADING_ENABLED
        value: "true"
      - key: EVM_TRADING_ENABLED
        value: "true"
      - key: MULTI_USER_CUSTODY
        value: "true"
      # Encrypted App-Level secrets scoped to ALL components — never commit:
      # DATABASE_URL, REDIS_URL, SESSION_SECRET,
      # SOLANA_BOT_PRIVATE_KEY, EVM_BOT_PRIVATE_KEY,
      # SOLANA_RPC_URL, SOLANA_WS_URL, SOLANA_RPC_FALLBACK_URLS, JUPITER_API_KEY,
      # EVM_*_RPC_URL, EVM_*_WS_URL, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
      # VITE_REOWN_PROJECT_ID / NEXT_PUBLIC_REOWN_PROJECT_ID / REOWN_PROJECT_ID
      # (public WalletConnect id — set App-Level RUN_AND_BUILD_TIME so the
      # dashboard can open the full Reown Connect Wallet modal),
      # Bot keys alone are not enough — RPC URLs must be on the api component too.
